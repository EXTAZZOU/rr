<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Logit — Rob Run</title>
<style>
/* Logit menu : pilote le backend antitchoy via window.chrome.webview.postMessage.
   L'aperçu de droite est purement cosmétique — il montre ce que donnent tes toggles. */
:root{
  --bg:#131318;--side:#0e0e13;--row:#17171d;--line:#ffffff0f;--line-2:#ffffff1c;
  --text:#f4f4f8;--muted:#8d8d9a;--faint:#5c5c68;
  --accent:#5b46ff;--accent-2:#7a69ff;--red:#ff4040;--ok:#4ade80;
  --font:'Poppins','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
body{font:13.5px/1.4 var(--font);color:var(--text);-webkit-font-smoothing:antialiased;user-select:none}
.gone{opacity:0;pointer-events:none}
[hidden]{display:none!important}

#app{position:fixed;left:0;top:0;width:1240px;height:660px;display:flex;gap:14px;transform:translateY(60px) scale(.7871);transform-origin:0 0;transition:opacity .25s}
#app.gone{opacity:0}
.win,.preview{background:var(--bg);border:1px solid var(--line-2);border-radius:18px;box-shadow:0 40px 110px #000000d9,0 0 90px #5b46ff14}
.win{flex:1;display:flex;min-width:0;overflow:hidden}
.stg{opacity:0}
#app.open .stg{animation:stg .35s ease-out both;animation-delay:var(--d,0ms)}
@keyframes stg{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

/* colonne de gauche */
aside{width:226px;flex:none;display:flex;flex-direction:column;padding:26px 16px 16px;background:var(--side);border-right:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;padding:0 8px 24px;font-weight:800;font-size:22px;letter-spacing:.04em}
.logo svg{width:28px;height:28px}
.logo small{font-size:10px;font-weight:600;color:var(--accent-2);padding:2px 7px;border:1px solid #5b46ff66;border-radius:999px;background:#5b46ff1f}
.field{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:10px}
.field input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit}
.field input::placeholder{color:var(--faint)}
.field svg{width:15px;height:15px;stroke:var(--muted);flex:none}
aside .field{margin-bottom:16px}
.item{display:flex;align-items:center;gap:11px;height:44px;padding:0 14px;border-radius:10px;font-weight:600;margin-bottom:5px;cursor:pointer;transition:background .2s}
.item:hover{background:#ffffff0a}
.item svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
.item .chev{margin-left:auto;width:12px;height:12px;stroke:var(--faint)}
.item.on{background:var(--accent);box-shadow:0 8px 24px #5b46ff55}
.item.on .chev{stroke:#fff}
.proof{margin-top:auto;display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border:1px solid var(--line-2);border-radius:12px;font-size:12px;cursor:pointer}
.proof b{display:block;font-weight:600}
.proof span{color:var(--red);font-size:11px}
.proof.safe span{color:var(--ok)}

/* centre */
main{flex:1;min-width:0;padding:18px 26px 20px;display:flex;flex-direction:column}
.top{display:flex;justify-content:flex-end;align-items:center;gap:14px;height:36px}
.preset{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;background:#ffffff0a;font-size:12.5px;font-weight:600;cursor:pointer}
.preset b{color:var(--accent-2);font-weight:600}
.preset svg,.top > svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8}
.preset svg:first-child{stroke:var(--accent-2)}
.top > svg{width:20px;height:20px}
.crumb{display:flex;align-items:center;gap:14px;margin:6px 0 22px;font-size:24px;font-weight:700}
.crumb span{color:var(--muted)}
.crumb svg{width:10px;height:10px;stroke:var(--faint);fill:none;stroke-width:2.4}
.tabs{display:flex;gap:6px;margin-bottom:16px}
.tabs span{padding:8px 15px;border-radius:9px;font-weight:600;color:var(--muted);cursor:pointer;transition:color .15s,background .15s}
.tabs span:hover{color:var(--text);background:#ffffff08}
.tabs span.on{background:#ffffff0d;color:var(--text)}
.tools{display:flex;gap:12px;margin-bottom:14px}
.tools .field{flex:1;height:42px}
.cta{display:flex;align-items:center;gap:9px;height:42px;padding:0 20px;border-radius:10px;background:var(--accent);font-weight:700;box-shadow:0 8px 24px #5b46ff44;cursor:pointer}
.cta i{font-style:normal;font-size:18px;font-weight:400;line-height:1}
.thead{display:flex;justify-content:space-between;padding:10px 52px 10px 18px;border-radius:9px 9px 0 0;background:var(--row);font-size:10.5px;font-weight:600;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.rows{flex:1;overflow-y:auto;overflow-x:hidden;margin-right:-10px;padding-right:10px}
.rows::-webkit-scrollbar{width:4px}
.rows::-webkit-scrollbar-thumb{background:#ffffff22;border-radius:4px}
.r{position:relative;display:flex;align-items:center;gap:12px;min-height:50px;padding:0 16px 0 18px;border-bottom:1px solid var(--line);animation:stg .28s ease-out both;animation-delay:var(--d,0ms)}
.rows.quiet .r{animation:none}
.r.src{cursor:pointer}
.r.sub{min-height:42px;padding-left:36px;border-bottom:0;font-size:13px}
.r.dim > *{opacity:.38}
.r .lab{flex:1;font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px;white-space:nowrap}
.r.sub .lab{font-size:13px;font-weight:400;color:#d8d8e0}
.r .lab small{display:block;font-size:11px;color:var(--faint)}
.r .lab .col{display:flex;flex-direction:column}
.info{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;background:#ffffff26;color:#0e0e13;font:700 9px var(--font);font-style:normal}
.tagx{font-style:normal;font-size:10.5px;color:var(--faint)}
a.edit{font-size:10.5px;color:var(--accent-2);cursor:pointer}
.val{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;width:44px;text-align:right}
.cv{display:grid;place-items:center;width:22px;height:22px;margin:0 -6px;flex:none}
.cv svg{width:10px;height:10px;stroke:var(--faint);fill:none;stroke-width:2.4;transition:transform .2s}
.cv.none{visibility:hidden}
.r.open > .cv svg{transform:rotate(180deg)}
.mini{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#ffffff0d;flex:none;cursor:pointer}
.mini svg{width:13px;height:13px;stroke:var(--muted);fill:none;stroke-width:2}
.tg{position:relative;width:44px;height:24px;flex:none;border:1px solid var(--line-2);border-radius:999px;background:#1a1a21;cursor:pointer;transition:background .2s,border-color .2s}
.tg::after{content:"";position:absolute;left:5px;top:4px;width:14px;height:14px;border-radius:50%;background:#4d4d59;transition:transform .2s cubic-bezier(.3,.9,.3,1),background .2s,box-shadow .2s}
.tg.on{background:#191736;border-color:#5b46ff66}
.tg.on::after{transform:translateX(18px);background:var(--accent-2);box-shadow:0 0 10px var(--accent)}
.tg.sm{width:36px;height:20px}
.tg.sm::after{left:4px;top:3px;width:12px;height:12px}
.tg.sm.on::after{transform:translateX(14px)}
.sl{position:relative;width:200px;height:20px;flex:none;cursor:pointer}
.sl::before{content:"";position:absolute;left:0;right:0;top:8px;height:4px;border-radius:4px;background:#ffffff14}
.sl i{position:absolute;left:0;top:8px;height:4px;border-radius:4px;background:var(--accent)}
.sl b{position:absolute;top:3px;width:5px;height:14px;margin-left:-2px;border-radius:3px;background:var(--accent-2);box-shadow:0 0 0 3px var(--bg)}
.sl em{position:absolute;top:-11px;right:0;font-style:normal;font-size:10px;color:var(--muted)}
/* champ de sélection + liste déroulante */
.sel{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;height:34px;min-width:150px;padding:0 12px;border-radius:8px;background:#ffffff0d;font-size:12.5px;cursor:pointer}
.sel.wide{width:200px}
.sel::after{content:"";width:6px;height:6px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
.sel.open::after{transform:rotate(225deg) translateY(-2px)}
.mode{display:flex;align-items:center;gap:7px;height:28px;padding:0 9px;border-radius:8px;font-weight:600;font-size:12.5px;cursor:pointer}
.mode:hover,.mode.open{background:#ffffff10}
.mode::after{content:"";width:5px;height:5px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg) translateY(-2px)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
.menu{position:absolute;z-index:20;right:0;top:calc(100% + 4px);min-width:100%;padding:5px;border-radius:10px;background:#1b1b22;border:1px solid var(--line-2);box-shadow:0 16px 40px #000c;animation:pop .12s ease-out;transform-origin:top right}
.menu div{display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:7px;font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer}
.menu div:hover{background:#ffffff10}
.menu div.on{background:var(--accent)}
.menu div .pk{margin-left:auto;display:flex;align-items:center;gap:5px;padding:3px 6px;border-radius:999px;background:#00000055}
.seg{display:flex;gap:3px;padding:3px;border:1px solid var(--line-2);border-radius:9px;background:#0c0c11}
.seg span{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.seg span.on{background:var(--accent);color:#fff}

.kb{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px;border:1px solid var(--line-2);color:var(--muted);background:#ffffff08}
.status{display:flex;align-items:center;gap:18px;height:32px;margin:8px -26px -20px;padding:0 26px;border-top:1px solid var(--line);background:#0e0e13;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.status b{font-weight:600;color:#d8d8e0}
.status .live{display:flex;align-items:center;gap:7px;color:var(--ok)}
.status .live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:blink 1.6s ease-in-out infinite}
.status span:last-child{margin-left:auto}
@keyframes blink{50%{opacity:.35}}
@keyframes float{50%{transform:translateY(-2.5px)}}
.fig{animation:float 4.2s ease-in-out infinite}

/* ── aperçu ── */
.preview{width:340px;flex:none;position:relative;overflow:hidden;transition:box-shadow .15s,border-color .15s;background:
  linear-gradient(180deg,#0f0f1400 0,#0f0f1400 34%,#101015 84%),
  radial-gradient(150px 120px at 22% 28%,#6f6b46b0,transparent 72%),
  radial-gradient(170px 150px at 80% 22%,#4f5d49a8,transparent 72%),
  radial-gradient(220px 170px at 52% 42%,#5d4038a8,transparent 72%),#17161c}
.preview.bye{border-color:#ff4040;box-shadow:0 0 0 1px #ff4040,0 0 40px #ff404066}
.pvhead{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;align-items:flex-start;gap:9px;padding:24px 20px 0 24px}
.pvhead h3{margin:0;flex:1;font-size:20px;font-weight:700;line-height:1.2}
.pvhead h3 small{display:block;height:15px;margin-top:3px;font-size:11px;font-weight:400;color:var(--muted);white-space:nowrap}
.pvhead h3 small b{color:#fff;font-weight:600;margin-right:5px}
.sq{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;background:#ffffff12;font-size:11px;font-weight:700;color:#d0d0d8;cursor:pointer;flex:none;transition:background .15s,color .15s}
.sq:hover{background:#fff;color:#111}
.sq svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
#area{position:absolute;inset:0;transition:filter .25s,opacity .25s}
.preview.blur #area,.preview.blur .pvhead h3{filter:blur(9px);opacity:.45}
.half{position:absolute;inset:0}
.fig{position:absolute}
.fig img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:bottom;-webkit-user-drag:none}
.fig img.tint{pointer-events:none}
.fig svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.fig svg [data-el]{pointer-events:visiblePainted}
.hit{fill:none;stroke:transparent;stroke-width:12;pointer-events:visibleStroke!important}
.lbs{position:absolute;left:-90px;right:-90px;display:flex;justify-content:center;align-items:baseline;gap:6px;white-space:nowrap;text-shadow:0 1px 3px #000}
.lbs.top{bottom:calc(100% + 3px)}
.lbs.bot{top:calc(100% + 3px);flex-direction:column;align-items:center;gap:0;line-height:1.35}
[data-el]{cursor:pointer}
.hov{filter:drop-shadow(0 0 5px #a79dff) drop-shadow(0 0 2px #fff)!important}
img.hov{filter:drop-shadow(0 0 2px #a79dff) drop-shadow(0 0 9px #7a69ff)!important}
.dragging{opacity:.25!important}
#ghost{position:fixed;z-index:95;pointer-events:none;transform:translate(-50%,-50%);font-weight:500;color:#fff;text-shadow:0 0 8px #c9c2ff,0 0 3px #fff;transition:left .5s ease,top .5s ease}
#ghost.live{transition:none}
#ghost i{display:block;width:5px;height:120px;border-radius:3px;background:linear-gradient(#333,#333 80%,#ff4040 80%);box-shadow:0 0 8px #c9c2ff}
#split{position:absolute;top:66px;bottom:44px;width:1px;background:#ffffffc0;z-index:4;pointer-events:none}
#ruler{position:absolute;left:22px;right:22px;bottom:30px;height:14px;z-index:5;cursor:ew-resize;
  background:repeating-linear-gradient(90deg,#ffffff5c 0 1px,transparent 1px 7px) 0 6px/100% 4px no-repeat,repeating-linear-gradient(90deg,#ffffffa0 0 1px,transparent 1px 35px) 0 3px/100% 8px no-repeat}
#knob{position:absolute;top:-2px;width:11px;height:14px;margin-left:-5.5px;background:var(--accent);clip-path:polygon(0 0,100% 0,100% 62%,50% 100%,0 62%)}
.foot{position:absolute;left:22px;right:22px;bottom:9px;z-index:5;display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);transition:opacity .2s}
.foot span:last-child{color:#e8e8ee}
#hide{position:absolute;left:0;right:0;bottom:0;height:120px;z-index:7;display:flex;align-items:flex-end;justify-content:center;gap:7px;padding-bottom:14px;font-size:12px;color:#d9a0a8;background:linear-gradient(0deg,#5a0c14e6,transparent);opacity:0;pointer-events:none;transition:opacity .2s}
.preview.dragon #hide{opacity:1}
.preview.dragon .foot,.preview.dragon #ruler{opacity:0}
.preview.bye #hide{color:#fff;font-weight:700;background:linear-gradient(0deg,#c0142ce6,transparent)}
/* feuille "Manage Elements" */
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;padding:18px 20px 20px;background:#15151bf2;border-top:1px solid var(--line-2);border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
#sheet.up{transform:none}
#sheet h4,#pop h4,#picker h4{margin:0 0 14px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:space-between}
.x{display:grid;place-items:center;width:24px;height:24px;border-radius:7px;background:#ffffff12;color:#ddd;font-size:13px;font-weight:400;cursor:pointer}
.x:hover{background:#ffffff26}
#sheet h5{margin:12px 0 7px;font-size:11px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:7px;background:#ffffff0f;font-size:11.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:background .1s,color .1s}
.chip.on{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 0 14px #5b46ff66}

/* panneaux flottants */
#pop,#picker{position:absolute;z-index:30;padding:16px 18px;border-radius:14px;background:#111116f7;border:1px solid var(--line-2);box-shadow:0 30px 70px #000d;animation:pop .14s ease-out;transform-origin:right center}
#pop{left:566px;top:232px;width:306px}
#picker{left:590px;top:70px;width:292px;z-index:31}
.fr{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;font-size:13px}
.fr.dim > *{opacity:.35;pointer-events:none}
.fr .sl{width:150px}
.sw{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--line-2);cursor:pointer}
.sw:hover{background:#ffffff12}
.sw i{width:15px;height:15px;border-radius:50%;background:var(--c);border:1.5px solid #111116}
.sw i + i{margin-left:-10px}
.sw u{text-decoration:none;font-size:11px;color:var(--muted);margin-left:2px}
.sw::after{content:"";width:5px;height:5px;border-right:1.6px solid var(--muted);border-bottom:1.6px solid var(--muted);transform:rotate(45deg) translateY(-2px);margin-left:2px}
.stops{display:flex;align-items:center;gap:5px;color:var(--faint);font-size:10px}
.stops i{width:17px;height:17px;border-radius:50%;background:var(--c)}
.stops em{display:grid;place-items:center;width:17px;height:17px;border-radius:50%;border:1px dashed #ffffff55;font-style:normal;font-size:12px;color:var(--muted)}
#picker h4 .hd{position:relative;display:flex;align-items:center;gap:8px;padding:4px 8px;margin:-4px -8px;border-radius:8px;cursor:pointer}
#picker h4 .hd:hover,#picker h4 .hd.open{background:#ffffff12}
#picker h4 .hd::after{content:"";width:5px;height:5px;border-right:1.6px solid #ccc;border-bottom:1.6px solid #ccc;transform:rotate(45deg) translateY(-2px)}
#picker .menu{left:0;right:auto;min-width:200px;transform-origin:top left}
.ck{width:14px;height:14px;border-radius:4px;border:1.5px solid #ffffff55;display:grid;place-items:center;font-size:10px}
#sv{position:relative;height:170px;border-radius:10px;cursor:crosshair;background:linear-gradient(0deg,#000,transparent),linear-gradient(90deg,#fff,hsl(var(--h) 100% 50%))}
.bar{position:relative;height:10px;margin-top:14px;border-radius:999px;cursor:pointer}
#hue{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
#alpha{background:linear-gradient(90deg,#fff0,var(--cur)),repeating-conic-gradient(#888 0 25%,#ccc 0 50%) 0 0/10px 10px}
.hd2{position:absolute;width:16px;height:16px;margin:-8px;border-radius:50%;border:2.5px solid #fff;background:var(--cur);box-shadow:0 1px 4px #000a;pointer-events:none}
.bar .hd2{top:5px}
.hexrow{display:flex;justify-content:space-between;margin-top:16px;padding:8px 12px;border:1px solid var(--line-2);border-radius:9px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.hexrow span + span{padding-left:12px;border-left:1px solid var(--line-2)}
#toast{position:absolute;left:50%;top:14px;z-index:40;transform:translate(-50%,-8px);padding:8px 14px;border-radius:10px;background:#1c1c24;border:1px solid var(--line-2);font-size:12px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.up{opacity:1;transform:translate(-50%,0)}

</style>
<style id="identity">
/* Identite propre a Logit : graphite + vert menthe, colonne etroite a icones, verre depoli. Supprimer ce bloc revient au style precedent. */
:root{
  --bg:#0c0d0e;--side:#08090a;--row:#111314;--line:#ffffff0d;--line-2:#ffffff17;
  --text:#eef1ef;--muted:#8a918d;--faint:#565c59;
  --accent:#2EFF9E;--accent-2:#2EFF9E;--ink:#04130c;
  --font:'Segoe UI Variable Display','Segoe UI',Inter,system-ui,sans-serif;
  --num:'Cascadia Mono','JetBrains Mono',Consolas,monospace;
}
body{letter-spacing:-.005em}
.win,.preview{border-radius:14px;border-color:#ffffff14;box-shadow:0 50px 120px #000000e6,inset 0 1px 0 #ffffff0f}
.win{position:relative;background:linear-gradient(180deg,#101213,#0b0c0d)}
.win::before{content:"";position:absolute;left:86px;right:0;top:0;height:1px;background:linear-gradient(90deg,transparent,#2EFF9E88 30%,transparent 75%);z-index:2}
/* colonne etroite : icone au-dessus du libelle */
aside{width:86px;padding:22px 10px 14px;align-items:center}
.logo{flex-direction:column;gap:7px;padding:0 0 20px;font-size:10px;font-weight:700;letter-spacing:.24em}
.logo svg{width:30px;height:30px;filter:drop-shadow(0 0 10px #2EFF9E66)}
.logo small,aside .field{display:none}
#nav{width:100%}
.item{flex-direction:column;justify-content:center;gap:6px;height:62px;padding:0;margin-bottom:4px;font-size:10.5px;font-weight:600;color:var(--muted);border-radius:10px}
.item svg{width:20px;height:20px;stroke-width:1.6}
.item .chev{display:none}
.item.on{background:#2EFF9E12;color:var(--accent);box-shadow:inset 2px 0 0 var(--accent)}
aside::after{content:"PRIVATE";margin-top:auto;padding:4px 8px;border:1px solid #2EFF9E44;border-radius:6px;font:700 8.5px var(--num);letter-spacing:.18em;color:var(--accent);background:#2EFF9E0d}
/* barre du haut */
.top{gap:12px}
.proof{margin:0 auto 0 0;display:flex;align-items:center;gap:10px;height:34px;padding:0 7px 0 13px;border-radius:999px;border:1px solid #ff404055;background:#ff40400f;font-size:12px}
.proof > div:first-child{display:flex;align-items:baseline;gap:8px}
.proof b{display:inline}
.proof span{font-size:11.5px}
.proof.safe{border-color:#2EFF9E55;background:#2EFF9E0f}
.preset{background:#ffffff08;border:1px solid var(--line)}
.preset b,.preset svg:first-child{color:var(--accent);stroke:var(--accent)}
.crumb{margin:10px 0 20px;font-size:22px;font-weight:600;letter-spacing:-.015em}
.crumb b{font-weight:650}
.tabs{gap:22px;margin-bottom:18px;border-bottom:1px solid var(--line)}
.tabs span{position:relative;padding:8px 0 11px;border-radius:0;font-weight:600}
.tabs span:hover{background:none}
.tabs span.on{background:none;color:var(--text)}
.tabs span.on::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;border-radius:2px;background:var(--accent);box-shadow:0 0 10px #2EFF9E88}
.field{border-color:var(--line-2);background:#ffffff05}
.cta{background:var(--accent);color:var(--ink);box-shadow:0 8px 26px #2EFF9E2e}
.thead{background:none;border-bottom:1px solid var(--line);border-radius:0;letter-spacing:.14em;font-size:10px;color:var(--faint)}
.r{border-bottom-color:#ffffff09}
.r.src:hover{background:#ffffff05}
.info{background:#ffffff1f}
a.edit{color:var(--accent)}
.val,.kb,.sl em,.hexrow,.status b,.status span:last-child{font-family:var(--num)}
.kb{border-color:var(--line-2);background:#ffffff06}
/* controles */
.tg{width:40px;height:22px;background:#15181a;border-color:#ffffff1c}
.tg::after{left:4px;top:3px;background:#5d6461}
.tg.on{background:#0f2a1e;border-color:#2EFF9E66}
.tg.on::after{transform:translateX(18px);background:var(--accent);box-shadow:0 0 10px #2EFF9Eaa}
.tg.sm.on::after{transform:translateX(14px)}
.sl i{background:linear-gradient(90deg,#2EFF9E66,var(--accent))}
.sl b{top:4px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#eef1ef;box-shadow:0 0 0 3px var(--bg),0 0 10px #2EFF9E66}
.sel,.mode:hover,.mode.open{background:#ffffff09}
.sel{border:1px solid var(--line)}
.menu{background:#101213f5;border-color:var(--line-2);backdrop-filter:blur(16px)}
.menu div.on{background:#2EFF9E1a;color:var(--accent)}
.seg{background:#08090a}
.seg span.on{background:#2EFF9E1c;color:var(--accent);box-shadow:inset 0 0 0 1px #2EFF9E55}
.status{background:#08090a;gap:20px}
#stLos[data-bad="1"]{color:#ffb84d}
/* apercu et panneaux flottants */
.sq{background:#ffffff0e;border:1px solid var(--line)}
.sq:hover{background:var(--accent);color:var(--ink)}
#knob{background:var(--accent)}
.hov{filter:drop-shadow(0 0 5px #2EFF9E) drop-shadow(0 0 2px #fff)!important}
img.hov{filter:drop-shadow(0 0 2px #b9ffe0) drop-shadow(0 0 10px #2EFF9E)!important}
#ghost{text-shadow:0 0 8px #2EFF9E,0 0 3px #fff}
#ghost i{box-shadow:0 0 8px #2EFF9E}
#sheet,#pop,#picker{background:#0e1011e6;backdrop-filter:blur(22px) saturate(1.2);border-color:#ffffff1a}
#pop::before,#picker::before{content:"";position:absolute;left:18px;right:18px;top:0;height:1px;background:linear-gradient(90deg,transparent,#2EFF9E99,transparent)}
.chip{border:1px solid transparent;background:#ffffff0b}
.chip.on{background:#2EFF9E18;border-color:#2EFF9E66;color:var(--accent);font-weight:600;box-shadow:none}
.x{background:#ffffff0e}
.sw{border-color:var(--line-2)}
</style>

    editing().c[S.pop][prop] = value;
    /* Curseurs du pop avec contrepartie backend : seul skel.width mappe line_w (1-4). */
    if (S.pop === "skel" && prop === "width") send("set:line_w:" + Math.round(value));
    renderPop(); renderStage();
  }
  else {
    const v = Math.round(min + k * (max - min));
    if (sl.dataset.key === "maxd") {
      source().maxd = v;
      /* Max distance par source → max_distance global en centimètres (value * 100). */
      send("set:max_distance:" + (v * 100));
    } else { S.val[sl.dataset.key] = v; sendSet(sl.dataset.key, v); }
    paintSlider(sl);
  }
}
function dragPicker(kind, x, y) {
  const r = $(kind).getBoundingClientRect(), fx = Math.min(1, Math.max(0, (x - r.left) / r.width)), fy = Math.min(1, Math.max(0, (y - r.top) / r.height)), k = S.pick;
  if (kind === "sv") { k.hsv[1] = fx; k.hsv[2] = 1 - fy; } else if (kind === "hue") k.hsv[0] = fx * 359.9; else k.a = fx * 100;
  pickSet(rgb2hex(...hsv2rgb(...k.hsv)));
  renderPicker(); renderStage(); renderPop();
  if (k.state) rowsBox.querySelectorAll(`.st[data-state="${k.state}"] .dot`).forEach(d => d.style.setProperty("--c", pickGet()));
  /* Émission couleur réelle au backend pour les éléments mappés (name/weapon/dist/armor/aim/downed). */
  sendColor();
}
function ghostFor(el) {
  ghost.hidden = false; ghost.className = "";
  ghost.innerHTML = EL[el].bar ? "<i></i>" : EL[el].text ? curView().txt[el] : EL[el].label;
  for (const n of area.querySelectorAll(`[data-el="${el}"]`)) n.classList.add("dragging");
  preview.classList.add("dragon");
  $("hideTxt").textContent = "Drag out of the panel to hide";
}
function dragMove(x, y) {
  ghost.style.left = x + "px"; ghost.style.top = y + "px";
  const r = preview.getBoundingClientRect(), out = x < r.left || x > r.right || y < r.top || y > r.bottom;
  preview.classList.toggle("bye", out);
  $("hideTxt").textContent = out ? "Let go to hide" : "Drag out of the panel to hide";
}
function dropEl(el, x, y) {     // dépose un élément : hors du panneau = masqué ; sinon nouvelle place
  const p = editing(), r = preview.getBoundingClientRect(), V = curView(), fig = area.querySelector(".fig").getBoundingClientRect();
  if (x < r.left || x > r.right || y < r.top || y > r.bottom) {
    p.on[el] = false;
    if (CHIP_KEY[el]) send("set:" + CHIP_KEY[el] + ":0");
  }
  else if (EL[el].text) {
    p.top = p.top.filter(k => k !== el); p.bottom = p.bottom.filter(k => k !== el);
    (y < fig.top + fig.height / 2 ? p.top : p.bottom).push(el);
  } else if (EL[el].bar) p.side[el] = x < fig.left + fig.width / 2 ? "left" : "right";
  ghost.hidden = true; preview.classList.remove("dragon", "bye");
  renderPreview();
}
app.addEventListener("pointerdown", event => {
  const t = event.target; let node;
  if ((node = t.closest(".sl"))) { drag = { type: "slider", node, rect: node.getBoundingClientRect() }; dragSlider(node, event.clientX, drag.rect); }
  else if ((node = t.closest("#sv,#hue,#alpha"))) { drag = { type: "pick", kind: node.id }; dragPicker(node.id, event.clientX, event.clientY); }
  else if (t.closest("#ruler")) drag = { type: "split" };
  else if ((node = t.closest("#area [data-el]"))) drag = { type: "el", el: node.dataset.el, x: event.clientX, y: event.clientY, moved: false };
  if (drag && drag.type !== "el") event.preventDefault();
});
addEventListener("pointermove", event => {
  if (!drag) return;
  const { clientX: x, clientY: y } = event;
  if (drag.type === "slider") dragSlider(drag.node, x, drag.rect);
  else if (drag.type === "pick") dragPicker(drag.kind, x, y);
  else if (drag.type === "split") { const r = preview.getBoundingClientRect(); S.split = Math.min(.92, Math.max(.08, (x - r.left) / r.width)); renderPreview(); }
  else if (drag.type === "el") {
    if (!drag.moved && Math.hypot(x - drag.x, y - drag.y) > 6 && drag.el !== "model") { drag.moved = true; ghostFor(drag.el); ghost.classList.add("live"); }
    if (drag.moved) dragMove(x, y);
  }
});
addEventListener("pointerup", event => {
  if (drag && drag.type === "el" && drag.moved) { dropEl(drag.el, event.clientX, event.clientY); suppressClick = true; setTimeout(() => suppressClick = false, 50); }
  if (drag && drag.type === "slider" && drag.node.dataset.key === "maxd") render(false);
  drag = null;
});

/* ── Télémétrie et état venus du backend ── */
$("stPid").textContent = "—";
$("stPl").textContent = "—";

const BOOL_KEYS = new Set(["aim","fov_show","los","closest","t_clan","t_police","norecoil","nospread",
  "x_on","x_out","snap_x","l_loose","l_node","l_box","l_door","l_drop","l_veh",
  "radar","radar_world","overlay","self","veh_mark","veh_occ","vehicle_chams"]);
function applyState(config) {
  if (!config) return;
  /* Toggles / sliders : on injecte les valeurs backend dans l'état UI. */
  for (const uiKey of Object.keys(MAP)) {
    const m = MAP[uiKey];
    if (!(m.k in config)) continue;
    const raw = config[m.k];
    const scale = m.scale || 1;
    const value = scale === 1 ? raw : raw / scale;
    /* Entiers 0/1 vont dans S.on ; valeurs continues dans S.val. */
    if (BOOL_KEYS.has(uiKey)) S.on[uiKey] = !!raw;
    else S.val[uiKey] = value;
  }
  /* Sources ESP. */
  for (const srcKey of Object.keys(SRC_KEY)) if (T[srcKey]) {
    const backendKey = SRC_KEY[srcKey];
    if (backendKey in config) T[srcKey].enabled = !!config[backendKey];
  }
  /* Chips Manage Elements → rappliqués sur le profil de la source actuelle. */
  const prof = source() && source().profile;
  if (prof) for (const chipName of Object.keys(CHIP_KEY)) {
    const backendKey = CHIP_KEY[chipName];
    if (backendKey in config) prof.on[chipName] = !!config[backendKey];
  }
  /* Tiers loot. */
  for (const label of Object.keys(LOOT_TIER)) {
    const bk = LOOT_TIER[label];
    if (bk in config) S.on["l_rar:" + label] = !!config[bk];
  }
  /* Enums. */
  if ("aa_bone"      in config) S.val.bone    = BONE[config.aa_bone] || BONE[0];
  if ("xhair_style"  in config) S.val.x_style = XHAIR_STYLE[config.xhair_style] || XHAIR_STYLE[1];
  if ("aa_key"       in config) {
    const match = Object.entries(AIM_KEY).find(([, v]) => v === config.aa_key);
    if (match) S.val.aim_key = match[0];
  }
  if ("streamsafe_on" in config) S.proof = !!config.streamsafe_on;
  /* show_snapline → source().snap : ancienne valeur préservée si déjà non-Off, sinon "Top" par défaut. */
  if ("show_snapline" in config) {
    const v = SNAP[config.show_snapline === true ? 1 : config.show_snapline] || "Off";
    S.val.snap = v;
    const cur = source();
    if (cur) cur.snap = v;
  }
  render(false);
}

function applyTelem(state) {
  if (!state) return;
  if ("pid"     in state) $("stPid").textContent = state.pid || "—";
  if ("targets" in state) $("stPl").textContent  = (state.targets ?? "—");
  if ("los"     in state) {
    const node = $("stLos");
    if (node) {
      node.textContent = ["Off", "Loading", "Ready"][state.los] || "Off";
      node.dataset.bad = state.los === 1 ? "1" : "0";
    }
  }
}

if (bridge) bridge.addEventListener("message", event => {
  const data = String(event.data || "");
  const cut = data.indexOf(":");
  const kind = cut < 0 ? data : data.slice(0, cut);
  const payload = cut < 0 ? "" : data.slice(cut + 1);
  if (kind === "toast") { toast(payload); return; }
  if (kind === "state") { try { applyState(JSON.parse(payload)); } catch (e) { toast("Bad state payload"); } return; }
  if (kind === "telem") { try { applyTelem(JSON.parse(payload)); } catch (e) { /* ignore */ } return; }
});

/* ── Escape ferme le menu (le backend décide quoi faire) ── */
addEventListener("keydown", event => {
  if (event.target && event.target.tagName === "INPUT") return;
  if (event.key === "Escape") send("close:");
});

/* ── Démarrage : on ouvre le menu et on annonce au backend qu'on est prêt ── */
render(true);
app.classList.remove("gone");
app.classList.add("open");
send("hello:");
</script>
</body>
